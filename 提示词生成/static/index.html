<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>提示词生成工作台</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>提示词生成工作台 <span id="current-model-badge" class="model-badge"></span></h1>
      <p class="subtitle">选一条「脚本分析」的历史结果 + 一个产品，套用同款结构生成新脚本与 AI 视频提示词</p>
    </div>
    <div class="header-actions">
      <button id="open-settings" class="btn-secondary">API 设置</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="generate">生成</button>
    <button class="tab-btn" data-tab="products">产品库</button>
    <button class="tab-btn" data-tab="history">创新脚本库</button>
  </nav>

  <section class="tab-panel active" id="panel-generate">
    <form id="generate-form">
      <label class="field">
        <span>参考脚本（来自「脚本分析」历史记录）</span>
        <select id="source-select" required></select>
      </label>
      <label class="field">
        <span>产品</span>
        <select id="product-select" required></select>
      </label>
      <label class="field">
        <span>生成数量（1-5）</span>
        <input type="number" id="script-count" min="1" max="5" value="5" required />
      </label>
      <label class="checkbox-field">
        <input type="checkbox" id="use-feedback-reference" />
        <span>参考历史反馈（采纳/优化编辑过的脚本）</span>
      </label>
      <button type="submit" class="btn-primary">生成新脚本</button>
    </form>
    <div id="generate-progress" class="progress hidden">
      <div class="spinner"></div>
      <span id="generate-progress-text">生成中，可能需要1分钟左右…</span>
    </div>
    <div id="generate-error" class="error hidden"></div>
  </section>

  <section class="tab-panel" id="panel-products">
    <form id="product-form">
      <input type="hidden" id="product-id" value="" />
      <label class="field">
        <span>产品/书名</span>
        <input type="text" id="product-name" required />
      </label>
      <label class="field">
        <span>年级分类</span>
        <select id="product-grade" required>
          <option value="小学">小学</option>
          <option value="初中">初中</option>
          <option value="高中">高中</option>
        </select>
      </label>
      <div class="form-row">
        <label class="field">
          <span>现价</span>
          <input type="text" id="product-price" placeholder="例如 19.8元" />
        </label>
        <label class="field">
          <span>原价/划线价</span>
          <input type="text" id="product-original-price" placeholder="选填" />
        </label>
      </div>
      <label class="field">
        <span>卖点（每行一条）</span>
        <textarea id="product-selling-points" rows="3"></textarea>
      </label>
      <label class="field">
        <span>痛点（每行一条）</span>
        <textarea id="product-pain-points" rows="3"></textarea>
      </label>
      <label class="field">
        <span>目标人群</span>
        <input type="text" id="product-target-audience" placeholder="例如 家有9月升初一孩子的家长" />
      </label>
      <label class="field">
        <span>正版特征/防伪信息</span>
        <input type="text" id="product-authenticity" placeholder="选填" />
      </label>
      <label class="field">
        <span>其他备注</span>
        <textarea id="product-extra-notes" rows="2"></textarea>
      </label>
      <div class="form-actions">
        <button type="submit" class="btn-primary" id="product-submit-btn">新建产品</button>
        <button type="button" class="btn-secondary hidden" id="product-cancel-btn">取消编辑</button>
      </div>
    </form>
    <div id="product-error" class="error hidden"></div>
    <div class="form-actions">
      <select id="product-grade-filter">
        <option value="">全部年级</option>
        <option value="小学">小学</option>
        <option value="初中">初中</option>
        <option value="高中">高中</option>
      </select>
      <button type="button" class="btn-secondary" id="product-filter-btn">查询</button>
    </div>
    <div id="product-list"></div>
  </section>

  <section class="tab-panel" id="panel-history">
    <div id="history-list"></div>
  </section>

  <section id="result" class="result hidden">
    <nav class="tabs" id="script-tabs"></nav>
    <div id="script-variant-meta" class="variant-meta"></div>
    <div id="script-status-bar" class="script-status-bar"></div>

    <nav class="result-tabs">
      <button class="result-tab-btn active" data-result-tab="structured">结构化脚本</button>
      <button class="result-tab-btn" data-result-tab="plain">纯文字脚本</button>
      <button class="result-tab-btn" data-result-tab="jimeng">即梦提示词</button>
      <button class="result-tab-btn" data-result-tab="kling">可灵提示词</button>
      <button class="result-tab-btn" data-result-tab="prompts">Prompt 记录</button>
    </nav>

    <div class="result-panel active" id="result-structured"></div>
    <div class="result-panel" id="result-plain">
      <div class="form-actions">
        <button id="copy-plain" class="btn-secondary">复制文本</button>
        <button id="edit-plain-btn" type="button" class="btn-secondary">编辑</button>
        <button id="save-plain-btn" type="button" class="btn-secondary hidden">保存</button>
        <button id="cancel-plain-btn" type="button" class="btn-secondary hidden">取消</button>
      </div>
      <pre id="plain-script"></pre>
      <textarea id="plain-script-edit" class="hidden" rows="16"></textarea>
    </div>
    <div class="result-panel" id="result-jimeng"></div>
    <div class="result-panel" id="result-kling"></div>
    <div class="result-panel" id="result-prompts"></div>
  </section>
</div>

<div id="settings-panel" class="settings-panel hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="settings-card">
    <div class="settings-heading">
      <div>
        <p class="eyebrow">本机配置</p>
        <h2 id="settings-title">LLM API 设置</h2>
      </div>
      <button id="close-settings" class="icon-button" aria-label="关闭设置">&times;</button>
    </div>
    <p id="key-status" class="settings-status">正在读取配置状态…</p>
    <form id="settings-form">
      <label class="field">
        <span>ANTHROPIC_API_KEY</span>
        <input id="api-key" type="password" autocomplete="new-password" spellcheck="false" placeholder="粘贴 API Key" required />
      </label>
      <label class="field">
        <span>ANTHROPIC_BASE_URL</span>
        <input id="base-url" type="text" spellcheck="false" placeholder="https://api.anthropic.com" />
      </label>
      <label class="field">
        <span>模型</span>
        <select id="model-select"></select>
      </label>
      <p id="settings-error" class="error" role="alert"></p>
      <div class="settings-actions">
        <button type="button" id="cancel-settings" class="btn-secondary">取消</button>
        <button type="submit" class="btn-primary">安全保存</button>
      </div>
    </form>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
